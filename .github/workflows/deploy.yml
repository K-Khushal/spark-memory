# Called by CI after checks pass. See docs/deploy.md for the secrets and
# variables each GitHub environment needs.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Wrangler and GitHub environment (dev or production)
        required: true
        type: string
      skip-without-token:
        description: Skip with a notice, instead of failing, when CLOUDFLARE_API_TOKEN is missing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Protection rules (required reviewers for production) apply before this job starts.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Check deploy configuration
        id: config
        env:
          SKIP_WITHOUT_TOKEN: ${{ inputs.skip-without-token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ "$SKIP_WITHOUT_TOKEN" = "true" ]; then
            echo "::notice title=Deploy to $TARGET skipped::CLOUDFLARE_API_TOKEN is not set. Add the secrets in docs/deploy.md to turn on deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -n "$DATABASE_URL" ] || missing+=("secret DATABASE_URL")
          if grep -q "PLACEHOLDER_$([ "$TARGET" = production ] && echo PROD || echo DEV)_HYPERDRIVE_ID" apps/server/wrangler.jsonc; then
            missing+=("Hyperdrive id in apps/server/wrangler.jsonc")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Deploy to $TARGET is not configured::Missing: ${missing[*]}. See docs/deploy.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the dashboard and Worker
        if: steps.config.outputs.ready == 'true'
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm exec turbo run build --filter=@spark/server

      # Migrations run first and must stay backwards compatible with the live Worker.
      - name: Migrate the database
        if: steps.config.outputs.ready == 'true'
        run: pnpm db:migrate

      - name: Deploy the Worker
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/server
          command: deploy --env ${{ inputs.environment }}

      - name: Check /api/health
        if: steps.config.outputs.ready == 'true' && vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$HEALTH_URL"
