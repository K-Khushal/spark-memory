name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this main commit to production (waits for approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark
          POSTGRES_DB: spark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark -d spark"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://spark:spark@localhost:5432/spark
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Package boundaries
        run: pnpm lint:boundaries
      - name: Formatting
        run: pnpm format:check
      - name: Migrate the test database
        run: pnpm db:migrate
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Playwright smoke test: sign in with an email code (dev outbox) and see the
  # empty Library. Separate from `check` so local `pnpm check` needs no browser.
  smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark
          POSTGRES_DB: spark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark -d spark"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://spark:spark@localhost:5432/spark
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @spark/web exec playwright install --with-deps chromium
      - name: Build the unpacked extension fixture
        run: pnpm --filter @spark/extension build
        env:
          WXT_API_ORIGIN: http://localhost:5173
          WXT_E2E: "1"
      - run: pnpm test:e2e
        env:
          EXTENSION_E2E: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  deploy-dev:
    needs: [check, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      skip-without-token: true
    secrets: inherit

  deploy-production:
    needs: [check, smoke]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
