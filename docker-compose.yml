# Local Postgres with pgvector for `pnpm dev` and integration tests.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark
    ports:
      - "5432:5432"
    volumes:
      - spark-db:/var/lib/postgresql/data
volumes:
  spark-db:
