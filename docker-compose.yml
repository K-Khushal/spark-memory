# Local Postgres with pgvector for `pnpm dev` and integration tests.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark
    ports:
      - "5432:5432"
    volumes:
      - spark-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  spark-db:
