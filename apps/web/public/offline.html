<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FFFFFF"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0F1012"
    />
    <title>Spark</title>
    <style>
      @font-face {
        font-family: Instrument;
        src: url("/fonts/assistant-instrument-sans.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Bricolage;
        src: url("/fonts/assistant-bricolage.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        color-scheme: light dark;
        --canvas: #ffffff;
        --ink: #111214;
        --line-strong: #898b91;
        --surface: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0f1012;
          --ink: #edeef0;
          --line-strong: #696b71;
          --surface: #1a1b1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--canvas);
        color: var(--ink);
        font-family: Instrument, sans-serif;
      }
      main {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      h1 {
        font-family: Bricolage, sans-serif;
        margin: 0;
        text-align: center;
        overflow-wrap: anywhere;
        font-size: 1.375rem;
        line-height: 1.875rem;
        font-weight: 600;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        padding: 0 1rem;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-size: 0.8125rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        a:active {
          transform: scale(0.97);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stack">
        <h1>Spark Is Offline</h1>
        <a href="/">Try Again</a>
      </div>
    </main>
  </body>
</html>
